name: Build & Push Docker Image to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: meta
        run: echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qvoo/iseatcx:latest
            ghcr.io/qvoo/iseatcx:${{ steps.meta.outputs.TAG }}

      # 构建离线 tar 镜像包，用于内网/无外网环境（Releases 附件）
      # 用 docker driver 构建出本地镜像再 docker save，保证 tar 可被 docker load。
      - name: Build offline image tar
        run: |
          docker buildx create --name localtar --driver docker --use 2>/dev/null || true
          mkdir -p out
          docker build --platform linux/amd64 -t iseat:latest .
          docker save iseat:latest -o out/iseat.tar
          ls -lh out/iseat.tar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## iSeatcx ${{ github.ref_name }}

            - **方式 A（推荐）**：`docker pull ghcr.io/qvoo/iseatcx:${{ steps.meta.outputs.TAG }}`
            - **方式 B（离线）**：下载下方 `iseat.tar`，然后
              ```bash
              docker load -i iseat.tar
              docker run -d --name iseat -p 5251:5251 -v iseat_data:/data iseat:latest
              ```
          files: out/iseat.tar
